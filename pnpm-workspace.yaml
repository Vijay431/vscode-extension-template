allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true

saveExact: true
savePrefix: ''

overrides:
  brace-expansion: '>=5.0.12'
  diff: '>=8.0.3'
  fast-uri: '>=3.1.8'
  form-data: '>=4.0.6'
  js-yaml: '>=4.3.2'
  katex: '>=0.18.2'
  linkify-it: '>=5.0.2'
  markdown-it: '>=14.3.2'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  qs: '>=6.16.0'
  serialize-javascript: '>=7.0.5'
  shell-quote: '>=1.11.0'
  smol-toml: '>=1.9.0'
  source-map-js: '>=1.2.2'
  tmp: '>=0.2.7'
  undici: '>=7.30.0'
  vite: '>=6.4.3'

# No patched release of braces exists (<=3.0.3 affected). Reachable only through
# dev-only publish tooling (ovsx > vsce > secretlint > globby > fast-glob > micromatch).
# Remove once braces ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
