version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '08:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - 'dependabot'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '08:00'
      timezone: 'Asia/Kolkata'
    labels:
      - 'dependabot'
    commit-message:
      prefix: 'ci'
